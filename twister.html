<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twister Caller</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #2c3e50;
            color: #333;
        }

        #app-container {
            background: white;
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            margin-top: 0;
            color: #7f8c8d;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #color-indicator {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: #ecf0f1;
            margin: 30px auto;
            border: 8px solid #bdc3c7;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1), 0 5px 15px rgba(0,0,0,0.2);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        #move-display {
            font-size: 2.5rem;
            font-weight: bold;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }

        button {
            font-size: 1.8rem;
            font-weight: bold;
            padding: 15px 50px;
            border: none;
            border-radius: 50px;
            background-color: #34495e;
            color: white;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.1s, background-color 0.2s;
            text-transform: uppercase;
        }

        button:active {
            transform: scale(0.95);
        }

        button:hover {
            background-color: #2c3e50;
        }

        /* Voice toggle switch */
        .toggle-container {
            margin-top: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #7f8c8d;
            font-weight: bold;
        }
        
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <h1>Twister Caller</h1>
        
        <div id="color-indicator"></div>
        <div id="move-display">Ready to Play!</div>
        
        <button id="spin-btn">SPIN</button>

        <div class="toggle-container">
            <input type="checkbox" id="voice-toggle" checked>
            <label for="voice-toggle">Enable Voice Caller</label>
        </div>
    </div>

    <script>
        // Game Data
        const extremities = ['Left Hand', 'Right Hand', 'Left Foot', 'Right Foot'];
        const colors = [
            { name: 'Red', hex: '#e74c3c' },
            { name: 'Blue', hex: '#3498db' },
            { name: 'Yellow', hex: '#f1c40f' },
            { name: 'Green', hex: '#2ecc71' }
        ];

        // DOM Elements
        const spinBtn = document.getElementById('spin-btn');
        const moveDisplay = document.getElementById('move-display');
        const colorIndicator = document.getElementById('color-indicator');
        const voiceToggle = document.getElementById('voice-toggle');

        // Spin Logic
        spinBtn.addEventListener('click', () => {
            // Cancel any currently playing speech to prevent overlap
            window.speechSynthesis.cancel();

            // Pick random extremity and color
            const randomExtremity = extremities[Math.floor(Math.random() * extremities.length)];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            
            const moveText = `${randomExtremity}, ${randomColor.name}!`;

            // Update UI
            moveDisplay.textContent = moveText;
            colorIndicator.style.backgroundColor = randomColor.hex;
            colorIndicator.style.borderColor = randomColor.hex;

            // Voice Synthesis
            if (voiceToggle.checked) {
                const utterance = new SpeechSynthesisUtterance(moveText);
                utterance.rate = 1.1; // Slightly faster for game pacing
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        });
    </script>

</body>
</html>
